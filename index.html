<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Website ditutup</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f3ee;
      color: #1a1a18;
      text-align: center;
    }

    main {
      width: min(100%, 560px);
      padding: 48px 32px;
      border: 1px solid #d8d4c8;
      border-radius: 18px;
      background: #ffffff;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
    }

    h1 {
      font-size: clamp(32px, 7vw, 56px);
      line-height: 1.1;
      margin-bottom: 12px;
    }

    p {
      color: #7a7769;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <main>
    <h1>Website ditutup</h1>
    <p>Terima kasih sudah berkunjung.</p>
  </main>
</body>
</html>
